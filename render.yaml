services:
  - type: web
    name: retinova
    runtime: python
    region: singapore
    plan: free
    buildCommand: python -m pip install -r requirements-render.txt
    startCommand: python -m scripts.serve_retinova --onnx-model models/efficientnet_b0_patient_grouped_v1/retinova_efficientnet_b0_cam.onnx --metadata models/efficientnet_b0_patient_grouped_v1/retinova_efficientnet_b0_cam.json --host 0.0.0.0 --deployment-mode cloud
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: RETINOVA_TEAM_PASSCODE
        sync: false
